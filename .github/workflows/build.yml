name: Build and Release

on:
  push:
    branches:
      - '1.21.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Read mod version
        id: ver
        run: |
          v=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build (Fabric + NeoForge)
        run: ./gradlew :fabric:build :neoforge:build -x test --no-daemon

      - name: Stage jars
        run: |
          mkdir -p dist
          cp fabric/build/libs/impaled-fabric-*.jar neoforge/build/libs/impaled-neoforge-*.jar dist/
          rm -f dist/*-sources.jar

      - uses: actions/upload-artifact@v7
        with:
          name: impaled-jars
          path: dist/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read mod version
        id: ver
        run: |
          v=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: impaled-jars
          path: release/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}-build.${{ github.run_number }}
          name: Impaled ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated build from `${{ github.ref_name }}` (commit ${{ github.sha }}).

            Artifacts:
            - `impaled-fabric-${{ steps.ver.outputs.version }}.jar` — for Fabric (requires Fabric API)
            - `impaled-neoforge-${{ steps.ver.outputs.version }}.jar` — for NeoForge (self-contained)
          files: release/*.jar
          draft: false
          prerelease: false
          make_latest: true
