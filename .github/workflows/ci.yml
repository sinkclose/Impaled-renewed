name: CI

on:
  pull_request:
  push:
    branches:
      - '1.21.1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedicated-server:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.loader }}
        run: ./gradlew :${{ matrix.loader }}:build --no-daemon --max-workers=2

      - name: Smoke-test dedicated server
        run: bash .github/smoke-server.sh ${{ matrix.loader }}

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.loader }}-server-logs
          path: ${{ matrix.loader }}/run/server/logs/
          if-no-files-found: ignore
